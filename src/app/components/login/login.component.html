<mat-sidenav-container>
    <!-- Sidebar -->
    <mat-sidenav mode="side" opened>
      <mat-toolbar>Task Manager</mat-toolbar>
      <button mat-button (click)="logout()">Logout</button>
    </mat-sidenav>
  
    <!-- Main Content -->
    <mat-sidenav-content>
      <mat-toolbar color="primary">
        <span>Dashboard</span>
        <span class="spacer"></span>
        <button mat-button color="accent" (click)="openTaskDialog()">+ Add Task</button>
      </mat-toolbar>
  
      <!-- Task Table -->
      <div class="table-container">
        <table mat-table [dataSource]="tasks" class="mat-elevation-z8">
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef> Title </th>
            <td mat-cell *matCellDef="let task"> {{task.title}} </td>
          </ng-container>
  
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Description </th>
            <td mat-cell *matCellDef="let task"> {{task.description}} </td>
          </ng-container>
  
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let task">
              <mat-chip [color]="getStatusColor(task.status)">{{ task.status }}</mat-chip>
            </td>
          </ng-container>
  
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let task">
              <button mat-icon-button color="warn" (click)="deleteTask(task.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="['title', 'description', 'status', 'actions']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['title', 'description', 'status', 'actions'];"></tr>
        </table>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
